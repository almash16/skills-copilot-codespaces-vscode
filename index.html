<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF Editor</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>📄 PDF Editor</h1>
            <p class="subtitle">Upload, view, and edit PDF documents</p>
        </header>

        <div class="controls">
            <div class="file-upload">
                <label for="pdf-upload" class="btn btn-primary">
                    📁 Upload PDF
                    <input type="file" id="pdf-upload" accept="application/pdf" hidden>
                </label>
            </div>

            <div class="edit-controls" id="edit-controls" style="display: none;">
                <button id="add-text-btn" class="btn btn-secondary">✏️ Add Text</button>
                <button id="add-annotation-btn" class="btn btn-secondary">📝 Add Note</button>
                <button id="clear-edits-btn" class="btn btn-secondary">🗑️ Clear Edits</button>
                <button id="download-btn" class="btn btn-success">💾 Download Info</button>
            </div>
        </div>

        <div class="pdf-viewer" id="pdf-viewer">
            <div class="placeholder" id="placeholder">
                <div class="placeholder-icon">📄</div>
                <p>No PDF loaded</p>
                <p class="placeholder-hint">Click "Upload PDF" to get started</p>
            </div>
            <div id="pdf-display" style="display: none;">
                <iframe id="pdf-iframe" style="width: 100%; height: 600px; border: none; border-radius: 8px;"></iframe>
            </div>
        </div>

        <div class="annotations-panel" id="annotations-panel" style="display: none;">
            <h3>📝 Annotations</h3>
            <div id="annotations-list"></div>
        </div>

        <div class="info-panel" id="info-panel" style="display: none;">
            <h3>📄 PDF Information</h3>
            <div id="pdf-info"></div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
